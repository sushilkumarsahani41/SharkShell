name: Build & Push SharkShell

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: greatsharktech/sharkshell
  GHCR_IMAGE: ghcr.io/sushilkumarsahani41/sharkshell

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sharkshell
          cache-to: type=gha,mode=max,scope=sharkshell

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Package script-based deploy bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p sharkshell-"$VERSION"/bin
          cp deploy.sh install.sh sharkshell-"$VERSION"/
          cp nginx.conf sharkshell-"$VERSION"/
          cp bin/run.sh bin/sharkshell sharkshell-"$VERSION"/bin/
          cp README.md LICENSE sharkshell-"$VERSION"/ 2>/dev/null || true
          tar -czf sharkshell-deploy-"$VERSION".tar.gz sharkshell-"$VERSION"
          tar -czf sharkshell-src.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            --exclude='.claude' --exclude='.github/hooks' --exclude='.github/skills' \
            --exclude='landing/screenshots' \
            backend frontend bin deploy.sh install.sh nginx.conf README.md LICENSE
          echo "Bundles: sharkshell-deploy-$VERSION.tar.gz, sharkshell-src.tar.gz"

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > RELEASE_NOTES.md <<EOF
          ## 🦈 SharkShell

          **Docker — zero-config deploy:**
          \`\`\`bash
          docker run -d -p 8080:80 greatsharktech/sharkshell:latest
          \`\`\`

          **Docker — with your own database:**
          \`\`\`bash
          docker run -d -p 8080:80 \\
            -e DB_HOST=your_db_host \\
            -e DB_USER=your_db_user \\
            -e DB_PASSWORD=your_db_pass \\
            -e DB_NAME=sharkshell \\
            greatsharktech/sharkshell:latest
          \`\`\`

          ---

          **Script-based deploy (LXC / VPS / bare metal, no Docker):**
          Supports Debian/Ubuntu (systemd) and Alpine (OpenRC), x86_64 + arm64. One command:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/sushilkumarsahani41/SharkShell/main/install.sh | sudo bash
          \`\`\`
          Or from this release bundle:
          \`\`\`bash
          curl -fsSL https://github.com/sushilkumarsahani41/SharkShell/releases/latest/download/sharkshell-deploy-${VERSION}.tar.gz \\
            | tar -xz && cd sharkshell-* && sudo ./deploy.sh
          \`\`\`
          Manage it with \`sharkshell status | logs | db | restart | update | uninstall\`.
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sharkshell-deploy-*.tar.gz
            sharkshell-src.tar.gz
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
